const MODEL='campaign-v6';
const CALLBACKS=Object.fromEntries(Object.entries(DATA.callbacks).map(([k,v])=>[Number(k),v]));
const partyKey=round=>round===1?'R':'D';
// v6: voters give votes, donors give DOLLARS, and days on the trail are a fixed calendar. Integer math only, so solo (browser) and live (server) agree exactly.
const RULES=DATA.rules;
function rhalf(n,d){const q=Math.floor((2*Math.abs(n)+d)/(2*d));return n>=0||q===0?q:-q;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function costOf(option){return option.cost||0;}  // days on the trail
// Money is kept in whole "units"; one unit = moneyDiv donation-points x the state's fundraising scale (DATA.fund, $K).
function unitDollars(race){return RULES.moneyDiv*(DATA.fund[race]||1)*1000;}
function groupDollars(race,donations,r){return donations*r*(DATA.fund[race]||1)*1000;}
function priceDollars(item,race){return RULES.items[item].price*unitDollars(race);}
// Deterministic, capped purchase effects on the votes a stop earned from the crowd (base).
function purchaseEffect(item,base){const it=RULES.items[item];if(!it)return null;
 if(item==='ad')return base>0?Math.min(it.cap,(base+1)>>1):0;
 if(item==='field')return base<0?Math.min(it.cap,(1-base)>>1):it.floor;
 if(item==='rapid')return 0;return null;}
function reactions(option,race,round){const code=option.r?.[partyKey(round)]?.[race]||'';return [...code].map(c=>c.charCodeAt(0)-50);}
function stopScore(option,race,round){
 const e=DATA.electorate[race],rs=reactions(option,race,round);let sv=0,sd=0;
 const groups=e.groups.map((g,i)=>{const r=rs[i]||0;sv+=e.voters[i]*r;sd+=e.donations[i]*r;return {g,voters:e.voters[i],donations:e.donations[i],r};});
 return {votes:rhalf(sv,RULES.voteDiv),money:rhalf(sd,RULES.moneyDiv),groups};
}
function money(d,signed=false){const a=Math.abs(d),s=d<0?'−':signed?'+':'';if(a>=995e3){const t=a>=1e7?Math.round(a/1e6)*10:Math.round(a/1e5);return s+'$'+(t%10?(t/10).toFixed(1):t/10)+'M';}return s+(a>=1e3?'$'+Math.round(a/1e3)+'K':'$'+a);}
function votesFor(option,race,round){return stopScore(option,race,round).votes;}
function share(points,race,round){const c=DATA.ceiling[partyKey(round)][race]||1;return Math.round(100*points/c);}
function makeState(now=Date.now()) {return {model:MODEL,revision:0,phase:'lobby',round:0,party:'D',tour:1,step:0,players:{},auth:{},events:[],seen:[],created:now};}
function publicState(s){const {auth,seen,...safe}=s;return safe;}
function validId(x){return typeof x==='string'&&/^p_[a-f0-9]{32}$/.test(x);}
function tally(p,round){const records=p.rounds[round]||[];return {points:records.reduce((n,r)=>n+(r?.points||0),0),time:RULES.days-records.reduce((n,r)=>n+(r?.cost||0),0),money:RULES.startMoney+records.reduce((n,r)=>n+(r?.raised||0)-(r?.spent||0),0),answered:records.filter(r=>Number.isInteger(r?.choice)&&r.choice<4).length,done:records.filter(Boolean).length};}
function evaluateChoice(p,round,step,choice){
 const card=DATA.cards[step],o=card?.options[choice];if(!o)throw new Error('Pick one of the five responses.');
 const t=tally(p,round),cost=costOf(o);if(t.time<cost)throw new Error('Not enough days left. Pick a shorter stop or keep quiet.');
 const previous=CALLBACKS[step],earlier=previous?p.rounds[round][previous.from]:null;
 const hasEarlier=Number.isInteger(earlier?.choice)&&earlier.choice<4;
 const conflict=Boolean(hasEarlier&&choice<4&&previous.conflicts.some(([a,b])=>a===earlier.choice&&b===choice));
 const callback=hasEarlier&&choice<4?(conflict?RULES.contradiction:RULES.consistent):0;
 const sc=stopScore(o,p.race,round),raised=Math.max(-t.money,sc.money)+0,base=sc.votes; // +0: never store -0
 return {choice,cost,raised,donors:sc.money,spent:0,buy:null,boost:0,base,callback,points:base+callback,conflict,explained:false,at:Date.now(),reason:card.reason,note:o.notes?.[p.race]||'',previous:hasEarlier?previous.from:null};
}
function leaderboard(s,round=s.round){const rows=Object.values(s.players).map(p=>{const t=tally(p,round);return {id:p.id,name:p.name,race:p.race,...t,share:share(t.points,p.race,round)};});rows.sort((a,b)=>(b.answered>=RULES.qualify)-(a.answered>=RULES.qualify)||b.share-a.share||b.points-a.points||a.name.localeCompare(b.name));return rows;}
function winners(s,round=s.round){const rows=leaderboard(s,round).filter(p=>p.answered>=RULES.qualify);return rows.length?rows.filter(p=>p.share===rows[0].share):[];}
function applyAction(original,a,host=false,identity=''){

 if(!a||typeof a!=='object'||typeof a.id!=='string'||!/^[a-zA-Z0-9_-]{8,100}$/.test(a.id))throw new Error('Invalid action identifier.');
 if(original.seen.includes(a.id))return {state:original,duplicate:true};

  if(!name)throw new Error('Enter a nickname.');
  if(!DATA.states.some(x=>x.id===a.race))throw new Error('Choose one of the eight races.');

  if(exists&&exists.race!==a.race&&s.phase!=='lobby')throw new Error('Your race stays fixed during the tour.');
  if(!exists&&Object.keys(s.players).length>=8)throw new Error('All eight places are taken.');
  if(!exists&&s.phase==='finished')throw new Error('This lesson has finished.');
  s.players[a.player]=exists?{...exists,name,race:a.race,lastSeen:now}:{id:a.player,name,race:a.race,rounds:[Array(20).fill(null),Array(20).fill(null)],lastSeen:now};
  s.auth[a.player]=identity;message=`${name} ${exists?'reconnected':'claimed '+a.race}.`;event.player=a.player;
 }else if(a.type==='choice'||a.type==='explain'||a.type==='buy'||a.type==='exit'){

  const p=s.players[a.player];event.player=p.id;event.race=p.race;
  if(a.type==='exit'){
   if(s.phase!=='results'&&s.phase!=='finished')throw new Error('Exit tickets open after the tour.');
   p.exit={handoff:String(a.handoff||'').trim().slice(0,600),indicator:String(a.indicator||'').trim().slice(0,600)};
   if(!p.exit.handoff||!p.exit.indicator)throw new Error('Complete both sentences.');message=`${p.name} shared an exit ticket.`;
  }else{

   const rec=p.rounds[s.round][s.step];
   if(a.type==='choice'){
    if(rec)throw new Error('Your response is already committed.');

    const r=evaluateChoice(p,s.round,s.step,a.choice);p.rounds[s.round][s.step]=r;
    message=`${p.name} (${p.race}) chose ${String.fromCharCode(65+a.choice)} · ${r.points>=0?'+':''}${r.points} votes, ${money(r.raised*unitDollars(p.race),true)}.`;event.choice=a.choice;event.points=r.points;
   }else if(a.type==='buy'){
    // One purchase per stop, after answering, before the bus leaves.
    if(!rec||rec.skipped)throw new Error('Answer this stop first.');

    const it=typeof a.item==='string'&&Object.hasOwn(RULES.items,a.item)?RULES.items[a.item]:null;if(!it)throw new Error('Pick something from the menu.');
    if(tally(p,s.round).money<it.price)throw new Error('Not enough money for that.');

    if(a.item==='rapid'){if(!rec.conflict||rec.explained)throw new Error('Rapid response only helps after a flip-flop.');delta=RULES.explained-rec.callback;rec.explained=true;rec.rapid=true;rec.callback=RULES.explained;}
    else{const eff=purchaseEffect(a.item,rec.base);if(!eff)throw new Error('TV ads amplify a stop that won votes. This one didn’t.');rec.boost=eff;delta=eff;}

   }else{
    if(!rec?.conflict||rec.explained)throw new Error('There is no unexplained change on this card.');

    const delta=RULES.explained-rec.callback;rec.explained=true;rec.callback=RULES.explained;rec.points=rec.base+rec.callback+(rec.boost||0);rec.cost+=RULES.explainCost;
    message=`${p.name} owned a flip-flop · +${delta} votes, −${RULES.explainCost} days.`;event.points=delta;
   }
  }
  p.lastSeen=now;
 }else if(a.type==='start'){
  if(s.phase!=='lobby'||Object.keys(s.players).length===0)throw new Error('At least one participant must claim a state first.');
  const pk=a.party===undefined?(s.party||'D'):a.party;if(pk!=='D'&&pk!=='R')throw new Error('Pick the Democratic or the Republican tour.');
  s.party=pk;s.round=pk==='R'?1:0;s.step=0;s.phase='play';message=`The ${pk==='R'?'Republican':'Democratic'} tour has started.`;
 }else if(a.type==='advance'){
  if(s.phase!=='play'||a.round!==s.round||a.step!==s.step)throw new Error('This stop has already changed.');
  const missing=Object.values(s.players).filter(p=>!p.rounds[s.round][s.step]);

 return `<div class="tourbar"><div><div class="kicker">${party()} tour · Chapter ${Math.floor(state.step/5)+1} / 4</div><h2 style="margin-top:6px">${p?race(p.race).name+' · '+esc(p.name):'Instructor’s seat'}</h2></div><div class="stats"><div class="stat"><strong>${p?t.points:'—'}</strong><span>Votes</span></div><div class="stat"><strong>${p?share(t.points,p.race,state.round)+'%':'—'}</strong><span>Share</span></div><div class="stat"><strong>${p?t.time:'—'}</strong><span>Days left</span></div><div class="stat"><strong>${p?money(t.money*unitDollars(p.race)):'—'}</strong><span>Money</span></div><div class="stat"><strong>${done}/${all}</strong><span>Ready</span></div></div></div><div class="route" aria-label="Tour progress">${DATA.cards.map((c,i)=>`<button title="Stop ${i+1}: ${c.title}" aria-label="Stop ${i+1}: ${c.title}${i===state.step?', current':''}" data-history="${i}" class="${i<state.step?'passed':''} ${i===state.step?'current':''}" ${i>state.step?'disabled':''}></button>`).join('')}</div>${state.step>0&&state.step%5===0?'<div class="chapter"><b>Chapter break.</b> Compare notes: whose state rewarded what?</div>':''}<div class="playgrid"><section><div class="scenehead"><div><div class="kicker">STOP ${String(state.step+1).padStart(2,'0')} · ${esc(card.topic)}</div><h2 style="margin-top:7px">${esc(card.title)}</h2></div><span class="sourcebadge">${p?esc(race(p.race).name):'2026 battleground'}</span></div><p class="sceneprompt">${esc(card.prompt)}</p><div class="artstage ${reacting?'reacting':''}" style="margin-top:12px">${CampaignArt.scene(card.kind,card.cast,rec?card.cast.map((key,i)=>key==='pat'?mood:i%2?'question':mood):'idle')}</div><div class="goal"><span class="kicker">Your job</span><b>${esc(card.goal)}</b></div>${p?Crowd.panel(state.step,p.race,rec,state.round):`<div class="clues">${card.clues.map((c,i)=>`<div class="clue"><b>0${i+1}</b>${esc(c)}</div>`).join('')}</div>`}${p?`<div class="localhint"><b>${esc(race(p.race).name)}:</b> ${esc(card.local[p.race]||'Local pressures: '+race(p.race).issues+'.')}</div>`:''}${cb&&Number.isInteger(earlier?.choice)&&earlier.choice<4?`<div class="callback"><b>Pat’s notebook · stop ${cb.from+1}</b><br>${esc(cb.text)}<br><em>“${esc(DATA.cards[cb.from].options[earlier.choice].label)}”</em></div>`:''}<button data-do="cardSources" style="margin-top:12px;font-size:11px">Sources & scoring notes</button></section><section><div class="choicehead"><h3>${p?'Your response':'Class responses'}</h3><span class="small muted">${p?t.answered+'/'+RULES.qualify+' on record to qualify':'Host controls below'}</span></div>${!p?'<div class="readonly">Students choose from these responses. You can watch the shared record below.</div>':''}<div class="choices">${card.options.map((o,i)=>{let conflict=false;try{conflict=p&&evaluateChoice(p,state.round,state.step,i).conflict;}catch{}const picked=rec?rec.choice===i:selected===i;return `<button class="choice ${i===4?'quiet':''} ${picked?'selected':''} ${rec?'submitted':''}" data-choice="${i}" ${!p||rec||pending||costOf(o)>t.time?'disabled':''} aria-pressed="${picked}"><span class="letter">${'ABCDE'[i]}</span><span class="label">${esc(o.label)}${conflict?'<span class="warning">Contradicts an earlier promise. Owning it costs ${RULES.explainCost} more days or a rapid response team.</span>':''}</span><span class="cost">${costOf(o)?costOf(o)+(costOf(o)>1?' days':' day'):'No days'}</span></button>`}).join('')}</div>${p&&!rec?`<button class="primary commit" data-do="commit" ${selected===null||pending?'disabled':''}>${selected===null?'Pick a line':'Say it: '+String.fromCharCode(65+selected)+' →'}</button><div class="caption">Once you say it, it’s on the record, and the class sees it.</div>`:''}${receiptHTML(rec,card)}${!p?table():''}</section></div><div class="hostbar"><span><b>${done} of ${all} committed.</b> ${rec?'Your answer is in.':'Answer before the bus leaves.'}</span><div class="actions">${isHost()?`<button class="primary" data-do="advance" ${done!==all||pending?'disabled':''}>${state.step===19?'Finish this tour':'Next stop'} →</button>${done!==all?'<button data-do="forceAdvance">Advance anyway</button>':''}`:'<span class="small">The instructor drives the bus.</span>'}</div></div><div class="lower"><section class="panel"><div class="rowspread"><h3>The campaign map</h3><button data-do="record">My record</button></div><div style="margin-top:12px">${mapHTML()}</div><div style="margin-top:16px">${raceCard()}</div></section><section class="panel"><div class="rowspread"><h3>The classroom</h3><button data-do="allRecords">Responses</button></div>${table()}<h3 style="margin-top:24px">Just happened</h3>${eventsHTML()}</section></div>`;
}
function eventsHTML(){return state.events.slice(-7).reverse().map(e=>`<div class="event">${esc(e.message)}</div>`).join('');}
function results(){const ws=winners(state),p=me();return `<section class="resultshero"><div class="kicker">${party()} tour · 20 stops complete</div><div class="castrow">${CampaignArt.character('pat','agree')}${CampaignArt.character('jo','agree')}${CampaignArt.character('frankie','agree')}</div><h1>${ws.length?ws.length>1?'A shared win.':esc(ws[0].name)+' wins.':'The tour is complete.'}</h1><p>${ws.length?ws.map(w=>esc(w.name)+' · '+w.race).join(' / ')+' · '+ws[0].share+'% of the available vote.':'Nobody went on record '+RULES.qualify+' times.'}</p><span class="tag">PLAYBOOK MATH · NOT AN ELECTION FORECAST</span>${isHost()?`<div class="actions" style="justify-content:center">${state.phase!=='finished'?'<button class="primary" data-do="finish">Finish & debrief</button>':''}<button data-do="rerun">Run the other party’s tour (fresh start)</button></div>`:''}</section><div class="resultpair"><section class="panel"><h3>${party()} tour</h3>${table()}<div class="actions"><button data-do="record">My full record</button><button data-do="allRecords">All responses</button>${isHost()?'<button data-do="export">Download class record</button>':''}</div></section><section class="panel"><h3>Debrief</h3><p style="margin-top:14px">Which line traveled across very different states? Where did purity cost you votes, and where did keeping quiet pay? Where did donors and voters want different things? Find one stop where the voters cheered and the donors booed, or the reverse. Was the money worth it? Name one purchase that paid off and one dollar you wish you had kept. You could always raise more money, but you could never buy back a day: where did that bite?</p></section></div>${p?myBreakdown(p,state.round):''}<section class="panel exitcard"><h3>Follow the promise into government.</h3><p style="margin-top:10px">Who needs to act, who pays, and where could delivery change the policy?</p>${p?`<form id="exitForm"><label class="field">The handoff most likely to change substantive policy is… because…<textarea id="handoff" maxlength="600" required>${esc(form.handoff||p.exit?.handoff||'')}</textarea></label><label class="field">A monitoring indicator that could reveal this change early is…<textarea id="indicator" maxlength="600" required>${esc(form.indicator||p.exit?.indicator||'')}</textarea></label><button class="primary" ${pending?'disabled':''}>Share my exit ticket</button><span class="caption"> Visible to this classroom.</span></form>`:'<p class="caption">Students can submit their two sentences here.</p>'}${Object.values(state.players).filter(p=>p.exit).map(p=>`<div class="saved-exit"><b>${esc(p.name)}</b><p>${esc(p.exit.handoff)}</p><p>${esc(p.exit.indicator)}</p></div>`).join('')}</section>`;}
function render(){
 const focus=document.activeElement,focusID=focus?.id,position=typeof focus?.selectionStart==='number'?focus.selectionStart:null;
 $('app').innerHTML=renderHeader()+`<main class="wrap">${!state?room?'<div class="empty">Connecting to your classroom…</div>':welcome():state.phase==='lobby'?lobby():!me()&&!isHost()?`<div class="panel"><h2>Join the tour</h2><p style="margin:12px 0">The class is at stop ${state.step+1}. Claim an available race to join.</p>${claimForm()}</div>`:state.phase==='play'?play():results()}<footer class="footer"><span>PLCY 8118 · Policy, promises, implementation · November 3, 2026</span><span>Real races. Vote math from the course playbook. <button data-do="sources">Sources</button></span></footer></main>`;
 if(focusID&&$(focusID)){const f=$(focusID);f.focus({preventScroll:true});if(position!==null&&f.setSelectionRange)try{f.setSelectionRange(position,position);}catch{}}
}
function myBreakdown(p,round){if(!p)return '';const recs=p.rounds[round]||[];const rows=recs.map((r,i)=>r?{r,i}:null).filter(Boolean);if(!rows.length)return '';const U=unitDollars(p.race),t=tally(p,round),raised=rows.reduce((n,x)=>n+(x.r.raised||0),0),spent=rows.reduce((n,x)=>n+(x.r.spent||0),0),bought=rows.reduce((n,x)=>n+(x.r.boost||0)+(x.r.rapid?RULES.explained-RULES.contradiction:0),0);return `<section class="panel"><h3>Why you got your votes</h3><p class="small" style="margin-top:8px">Each stop: the crowd’s votes, your promise checks, what you bought, and the dollars donors gave or pulled. Open a stop to see every group.</p><div class="stoplist">${rows.map(({r,i})=>{const dm=((r.raised||0)-(r.spent||0))*U;return `<details class="why"><summary><span>${i+1}. ${esc(DATA.cards[i].title)} · ${r.skipped?'skipped':'ABCDE'[r.choice]}${r.buy?' · '+esc(r.buy==='rapid'?'rapid response':r.buy==='ad'?'TV ad':'field'):''}</span><span><b>${r.points>=0?'+':''}${r.points}</b> votes · ${money(dm,true)} · ${r.cost||0}d</span></summary>${r.skipped?'<p class="small">The bus left before you answered.</p>':Crowd.breakdown(i,r.choice,p.race,round,r)}</details>`;}).join('')}</div><p class="small" style="margin-top:10px"><b>Total: ${t.points} votes</b> (${share(t.points,p.race,round)}% of the best possible in ${esc(race(p.race).name)}). Donors gave you ${money(raised*U)} net; you spent ${money(spent*U)}, which bought ${bought} votes. ${money(t.money*U)} left in the bank, ${t.time} of ${RULES.days} days unused.</p></section>`;}
function scoringExample(){const step=1,card=DATA.cards[step],ci=card.options.findIndex(o=>o.label.startsWith('Scrap the tariffs'));if(ci<0)return '';const o=card.options[ci],sc=stopScore(o,'TX',0),R=RULES,F=DATA.fund.TX,U=unitDollars('TX'),g=k=>sc.groups.find(x=>x.g===k);const big=g('bigmoney'),un=g('unions');const f=x=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(1);const ad=purchaseEffect('ad',sc.votes),fd=purchaseEffect('field',sc.votes);
 return `<div class="example"><b>Worked example: a Texas Democrat at stop 2, “${esc(o.label)}.”</b> Texas is a giant TV market, so each donation point is worth $${F}K per notch of enthusiasm.<ul><li><b>Big donors &amp; tech bros</b> are ${big.voters}% of Texas voters but ${big.donations}% of the money, and they love it (▲▲, +2). Votes: ${big.voters} × 2 ÷ ${R.voteDiv} = ${f(big.voters*big.r/R.voteDiv)}. Dollars: ${big.donations} × 2 × $${F}K = <b>${money(groupDollars('TX',big.donations,big.r),true)}</b>.</li><li><b>Union households</b> (${un.voters}% of voters, ${un.donations}% of the money) don’t like it (▼, −1): ${f(un.voters*un.r/R.voteDiv)} votes and ${money(groupDollars('TX',un.donations,un.r),true)}.</li><li>Everyone else shrugs or nets out. Total: <b>${sc.votes>=0?'+':''}${sc.votes} votes and ${money(sc.money*U,true)}</b>, for ${costOf(o)} days on the trail.</li><li>Now spend it? A TV ad here costs ${money(R.items.ad.price*U)} and ${ad?`adds ${ad} votes`:'does nothing, because ads only amplify a stop that won votes'}. Field staff cost ${money(R.items.field.price*U)} and add ${fd} vote${fd===1?'':'s'}. The donors loved this line, but the voters barely moved. That’s the trade.</li></ul></div>`;}
function showRules(){const R=RULES,I=R.items,TX=unitDollars('TX'),AK=unitDollars('AK');modal('How to play',`<p><b>Win the biggest share of your state’s available votes.</b> Go on record (A–D) at least ${R.qualify} times out of 20 to qualify. Ties are shared wins.</p><ol><li>Claim a state. Each one has real 2026 nominees and its own local pressures.</li><li>At each stop, read who’s in the room and your state’s local angle, then pick A–D or “Keep very quiet / pivot hard.”</li><li>You get <b>${R.days} days on the trail</b>. Each answer costs the days shown on the button (1 or 2); keeping quiet is free. Days never come back, and no donor can buy you more.</li><li>After you answer, you may <b>spend money</b> on one thing from the menu (below).</li><li>Five stops bring back an earlier promise. Stay consistent for +${R.consistent}. Contradict yourself and lose ${-R.contradiction}. You can own the flip-flop for +${R.explained} instead, either by spending ${R.explainCost} days on the trail explaining it or by paying a rapid response team.</li></ol>
<h3 style="margin-top:16px">How scoring works</h3><p><b>Voters give you votes. Donors give you dollars. Days are the clock.</b></p><p>Every state has a room full of groups. Each group has a share of the state’s voters and a share of its campaign money; both columns add to 100%. When you answer, every group reacts: ▼▼ strongly against (−2), ▼ against (−1), ● neutral (0), ▲ for (+1), ▲▲ strongly for (+2).</p><ul><li><b>Votes</b> = each group’s voter share × its reaction, added up and divided by ${R.voteDiv}. Everyone cheering wildly is +10; everyone booing is −10.</li><li><b>Dollars</b> = each group’s donation share × its reaction × your state’s fundraising rate. Big media markets raise more: Texas is $${DATA.fund.TX}K a point, Alaska $${DATA.fund.AK}K. Angry donors pull money back. Your bank account never goes below $0.</li></ul>${scoringExample()}
<h3 style="margin-top:16px">The spending menu</h3><p>One purchase per stop, right after you answer. Prices scale with your state (Texas / Alaska shown).</p><ul><li><b>TV ad buy</b> · ${money(I.ad.price*TX)} / ${money(I.ad.price*AK)}. Amplifies a stop that won votes: about half the crowd’s votes again, up to +${I.ad.cap}. On a stop that lost votes it does nothing.</li><li><b>Field staff &amp; GOTV</b> · ${money(I.field.price*TX)} / ${money(I.field.price*AK)}. After a backlash, door-knockers win back half the lost votes, up to +${I.field.cap}. Otherwise they turn out your people: +${I.field.floor}.</li><li><b>Rapid response team</b> · ${money(I.rapid.price*TX)} / ${money(I.rapid.price*AK)}. Only after a flip-flop: owns it for you (+${R.explained} instead of ${R.contradiction}) without spending days.</li></ul><p>You start with ${money(R.startMoney*TX)} in Texas (${money(R.startMoney*AK)} in Alaska). Money you never spend scores nothing. But ads can’t rescue a line the voters hate, and money can’t buy days. The best campaigns say things voters like, pick the lines donors fund, and spend on the right stops.</p><p><b>Share</b> is your votes divided by the best score anyone could get in your state as your party, including the smartest spending. That keeps tiny Alaska and giant Texas on the same scoreboard. After each answer, open “Why?” to see every group’s reaction and dollars; the results screen shows it for every stop.</p><p>Keeping quiet is sometimes the smartest move, especially on polarizing culture-war fights in middle-tier states. On pocketbook issues, silence usually costs you, and small-dollar donors hate it.</p><p>Each tour is one party, picked by the instructor (or by you in solo). It has its own start, results, winner, and debrief. Afterward the instructor can start the other party’s tour as a fresh run with new days, new money, new scores, and new state claims, or just finish.</p><p class="small muted">The group shares, fundraising rates and prices are illustrative estimates for class, not polling or FEC data. Only nicknames, choices, scores, and exit tickets are saved. Rooms last 48 hours. Keep your instructor link private; share only the student room link.</p>`);}
function sourceHTML(keys){const list=keys?DATA.sources.filter(s=>keys.includes(s.key)):DATA.sources;return `<p><b>Where the vote math comes from.</b> Every vote value comes from the course’s <i>Senate Battlegrounds 2026</i> playbook: its state-by-state messaging advice and its cross-cutting rules (cost of living is the master frame; the Iran war punishes candidates who skip the pocketbook; most swing voters care more about gas prices than about AIPAC; quiet on culture-war fights often pays in middle-tier states). Those are design judgments, not poll results. SCORING.txt lists every value for every state and party.</p><p>Candidates and races were checked November 3, 2026. Populations are July 2025 Census estimates (Kansas: approximate). The lesson does not pull live returns.</p><p>The AIPAC panel stands for an advocacy organization and its PACs, not for any religious community. Members of every group on screen disagree with each other.</p><div class="source-list">${list.map(s=>s.url?`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></p>`:`<p>${esc(s.title)}</p>`).join('')}</div><p class="small muted">Map geometry: Census boundaries via us-atlas (ISC). Original SVG character artwork. No external fonts or art.</p>`;}
function showRecord(id=identity.id,round=state.round){const p=state.players[id];if(!p){modal('Campaign record','<p>Claim a race to start a personal record.</p>');return;}modal(p.name+' · '+(round?'Republican':'Democratic'),`<table class="history"><thead><tr><th>Stop</th><th>Response</th><th>Votes</th><th>Dollars</th><th>Days</th></tr></thead><tbody>${p.rounds[round].map((r,i)=>r?`<tr><td><button data-detail="${i}" data-player="${p.id}" data-round="${round}">${i+1}. ${esc(DATA.cards[i].title)}</button></td><td>${r.skipped?'Skipped':'ABCDE'[r.choice]+(r.explained?' · explained':'')+(r.buy?' · '+(r.buy==='rapid'?'rapid response':r.buy==='ad'?'TV ad':'field'):'')}</td><td>${r.points}</td><td>${money(((r.raised||0)-(r.spent||0))*unitDollars(p.race),true)}</td><td>${r.cost||0}</td></tr>`:'').join('')}</tbody></table><p class="caption">Dollars: what donors gave minus what you spent. Days: days on the trail used. Click a stop to see every group.</p>`);}
document.addEventListener('input',e=>{const map={nickname:'name',raceSelect:'race',handoff:'handoff',indicator:'indicator'};if(map[e.target.id])form[map[e.target.id]]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='raceSelect'){form.race=e.target.value;focusRace=e.target.value;render();}});
document.addEventListener('submit',async e=>{
 if(e.target.id==='joinForm'){e.preventDefault();identity.name=form.name.trim();writeStore('stump_identity',identity);await send({type:'join',name:form.name,race:form.race});if(me())focusRace=me().race;render();}
 if(e.target.id==='exitForm'){e.preventDefault();await send({type:'exit',handoff:form.handoff||me()?.exit?.handoff,indicator:form.indicator||me()?.exit?.indicator});}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('path[data-race]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-do],[data-race],[data-choice],[data-history],[data-viewrecord],[data-detail]');if(!el||el.disabled)return;
 if(el.dataset.race){focusRace=el.dataset.race;if(!me()||state?.phase==='lobby')form.race=focusRace;render();return;}
 if(el.dataset.choice!==undefined){selected=Number(el.dataset.choice);selectedStep=state.step;render();return;}
 if(el.dataset.history!==undefined){const i=Number(el.dataset.history);modal('Stop '+(i+1)+' · '+DATA.cards[i].title,`<p>${esc(DATA.cards[i].goal)}</p><ul>${DATA.cards[i].clues.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p>${esc(DATA.cards[i].reason)}</p>`);return;}
 if(el.dataset.viewrecord){showRecord(el.dataset.viewrecord,Number(el.dataset.round??state.round));return;}
 if(el.dataset.detail!==undefined){const i=Number(el.dataset.detail),p=state.players[el.dataset.player],r=p.rounds[Number(el.dataset.round)][i];modal('Stop '+(i+1)+' · '+DATA.cards[i].title,`<p>${esc(DATA.cards[i].goal)}</p>${receiptHTML(r,DATA.cards[i],p.race,Number(el.dataset.round)).replace(/<button[\s\S]*?<\/button>/g,'')}`);return;}
 const type=el.dataset.do;
 if(type==='closeModal'){$('modal').close();return;}
 if(type==='motion'){motion=!motion;writeStore('stump_motion',motion);document.body.classList.toggle('motion-off',!motion);render();return;}
 if(type==='rules'){showRules();return;}if(type==='sources'){modal('Sources & scoring notes',sourceHTML());return;}if(type==='cardSources'){modal('Sources for this stop',sourceHTML(DATA.cards[state.step].sources));return;}
 if(type==='share'){modal('Share the classroom',`<p>Send this student link to the class. It excludes your instructor key.</p><input id="roomLink" readonly value="${esc(studentLink())}"><button data-do="copyLink" style="margin-top:12px">Copy student link</button><p class="caption">Keep your current instructor tab open or bookmark its full private address.</p>`);return;}
 if(type==='copyLink'){try{await navigator.clipboard.writeText(studentLink());toast('Student link copied.');}catch{$('roomLink').select();toast('Select and copy the highlighted link.');}return;}
 if(type==='create'){if(pending)return;pending=true;render();try{const v=await request({op:'create'});if(v.state?.model!==MODEL)throw new Error('the classroom server runs different rules than this page. Use the solo tour, or redeploy the backend with this version’s data.mjs and engine.mjs');room=v.room;roomKey=v.roomKey;hostKey=v.hostKey;state=v.state;setUrl();connect();}catch(e){toast('Could not create a classroom: '+e.message,true);}finally{pending=false;render();}return;}
 if(type==='solo'){solo=true;hostKey='';room='';roomKey='';state=makeState();selected=null;connected=false;setUrl();writeStore('stump_solo',state);render();return;}
 if(type==='start'){await send({type:'start',party:el.dataset.party==='R'?'R':'D'});return;}
 if(type==='commit'){if(selected===null||selectedStep!==state.step)return;await send({type:'choice',choice:selected,round:state.round,step:state.step});return;}
 if(type==='explain'){await send({type:'explain',round:state.round,step:state.step});return;}
 if(type==='buy'){await send({type:'buy',round:state.round,step:state.step,item:el.dataset.item});return;}
 if(type==='advance'){await send({type:'advance',round:state.round,step:state.step});return;}
 if(type==='forceAdvance'){modal('Advance this stop?',`<p>Unsubmitted responses at stop ${state.step+1} will be marked skipped. They earn no votes and use no days or money.</p><button class="primary" data-do="confirmAdvance" data-step="${state.step}" data-round="${state.round}">Advance anyway</button>`);return;}
 if(type==='confirmAdvance'){$('modal').close();await send({type:'advance',round:Number(el.dataset.round),step:Number(el.dataset.step),force:true});return;}
 if(type==='rerun'){modal('Run the other party’s tour?',`<p>This starts a fresh ${state.party==='R'?'Democratic':'Republican'} tour: everyone’s scores, days, money, and exit tickets for this tour are cleared, and students can claim a different state.</p><p><b>Download the class record first</b> if you want to keep this tour.</p><div class="actions"><button data-do="export">Download class record</button><button class="primary" data-do="confirmRerun">Start fresh tour</button></div>`);return;}if(type==='confirmRerun'){$('modal').close();await send({type:'rerun'});return;}if(type==='finish'){await send({type:'finish'});return;}
 if(type==='record'){showRecord();return;}
 if(type==='allRecords'){modal('Shared campaign records',Object.values(state.players).map(p=>`<div class="personrow"><span>${esc(p.name)} · ${p.race}</span><button data-viewrecord="${p.id}">View record</button></div>`).join(''));return;}
 if(type==='export'){const safe=solo?publicState(state):state;const blob=new Blob([JSON.stringify({lesson:'On the Stump',date:DATA.date,party:state.party==='R'?'Republican':'Democratic',tour:state.tour||1,exported:new Date().toISOString(),state:safe},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='campaign-class-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
});
window.addEventListener('beforeunload',()=>{stopped=true;streamAbort?.abort();});
render();if(room)connect();

</script></body></html>
